# - claude
# - claude-powerline
# - claude-squad
# - direnv
# - docker-cli
# - github-cli
# - kubectx
[tools]
amazon-ecr-credential-helper = "latest"
ansible = "latest"
bat = "latest"
chezmoi = "latest"
conftest = "latest"
"github:docker-credential-magic/docker-credential-magic" = "latest"
go = "latest"
golangci-lint = "latest"
grpcurl = "latest"
hadolint = "latest"
jq = "latest"
k9s = "latest"
kubectl = "latest"
markdownlint-cli2 = "latest"
node = "lts"
"pipx:ansible-lint" = "latest"
"pipx:gnome-extensions-cli" = "latest"
pnpm = "latest"
pre-commit = "latest"
python = "3"
shellcheck = "latest"
shfmt = "latest"
terraform = "latest"
terraform-docs = "latest"
terragrunt = "latest"
tflint = "latest"
yamllint = "latest"
yq = "latest"
